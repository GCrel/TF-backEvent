services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: .
    container_name: tf_backevent_app
    restart: always
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      IMAGES_STORAGE_PATH: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:1.27-alpine
    container_name: tf_backevent_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./deploy/nginx/images.conf:/etc/nginx/snippets/images.conf:ro,z
      - uploads:/srv/images:ro
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
