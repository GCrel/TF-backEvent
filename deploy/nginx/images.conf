# Imágenes de eventos: Nginx las lee directo del volumen (montado en solo lectura)
# para que las descargas no pasen por la JVM. El backend solo las escribe.

# Solo nombres generados por el backend: <uuid>.(webp|jpg|png). Ningún otro valor
# llega al disco, lo que descarta path traversal y nombres arbitrarios.
location ~ "^/api/v1/images/(?<image_file>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(?:webp|jpg|png))$" {
    limit_except GET { deny all; }
    alias /srv/images/$image_file;

    # El tipo sale de la extensión, que el backend asigna según el contenido real.
    # nosniff impide que el navegador interprete el archivo como otra cosa (p. ej. HTML).
    add_header X-Content-Type-Options "nosniff" always;
    # Cada imagen nueva recibe otra clave, así que el contenido de una URL nunca cambia.
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Cualquier otra ruta bajo /api/v1/images/ no existe (y no se reenvía al backend).
location /api/v1/images/ {
    return 404;
}
