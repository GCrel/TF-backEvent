# Application
spring.application.name=TF-backEvent
server.port=8085

# Database
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Hibernate DDL auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# JWT
jwt.secret=${JWT_SECRET_KEY}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# SMTP
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# MercadoPago
mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN}
mercadopago.webhook-secret=${MERCADO_PAGO_WEBHOOK_SECRET}
# MercadoPago OAuth
mercadopago.client-id=${MERCADO_PAGO_CLIENT_ID}
mercadopago.client-secret=${MERCADO_PAGO_CLIENT_SECRET}
mercadopago.redirect-uri=${MERCADO_PAGO_REDIRECT_URI}
# Ruta del frontend a la que vuelve el organizador tras el OAuth (?status=linked|error)
mercadopago.frontend-return-url=${MERCADO_PAGO_FRONTEND_RETURN_URL}

# Payment recovery
payment.recovery.retry-delay-ms=60000
payment.recovery.pending-after-minutes=5
payment.recovery.orphan-after-minutes=15

# Ticket purchase
ticket.purchase.max-quantity=10

# Ticket delivery (email): reintentos con backoff exponencial
ticket.delivery.max-attempts=8
ticket.delivery.initial-backoff-minutes=1
ticket.delivery.max-backoff-minutes=60

# Event access window (relative to dateTime; no endDateTime is modeled)
event.access-window.before-hours=3
event.access-window.after-hours=12
event.finish.retry-delay-ms=60000
